name: Notify Downstream Repositories

on:
  push:
    branches:
      - main  # 当 CCBook 的 main 分支有更新时触发
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Markdown (MkDocs) 仓库重新构建
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/HNU-CloudComputing/CloudComputingMarkdown/dispatches \
            -d '{"event_type": "source_book_updated"}'

      - name: 触发 PDF 仓库重新构建
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/HNU-CloudComputing/CloudComputingPDF/dispatches \
            -d '{"event_type": "source_book_updated"}'